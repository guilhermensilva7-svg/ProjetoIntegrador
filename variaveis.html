<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome = prompt('qual seu nome');
        var salario = Number(prompt('qual é seu salario'));
        var venda = Number(prompt('qual foi sua venda'));
        var comisão = 0;

        comissão = venda * 0.025;
        salario = salario + comissão;

document.write('<h1>Ola ' + nome + 'você irá receber' + salario + ' esse mês</h1>');
    </script>
</body>
