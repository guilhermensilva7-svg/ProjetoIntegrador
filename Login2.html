<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NutriCampo</title>
  <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style/Login2.css">

  <!-- FRAMEWORK DE ANIMAÇÃO (AOS) -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- FRAMEWORK DE ÍCONES (Font Awesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <nav>
      <a href="Noticias.html"><i class="fa-regular fa-newspaper me-1"></i> Notícias</a>
      <a href="Sobrenós.html"><i class="fa-solid fa-users me-1"></i> Nós</a>
      <a href="Index.html"><i class="fa-solid fa-house me-1"></i> Início</a>
      <a href="Clientes.html"><i class="fa-solid fa-address-book me-1"></i> Clientes</a>
    </nav>
    <img class="logo" src="Imagens/2.png" alt="Logo NutriCampo">
  </header>

  <!-- CONTAINER PRINCIPAL DO FORMULÁRIO (Animação Zoom-In) -->
  <div class="main-container" data-aos="zoom-in" data-aos-duration="800">
    <h1 class="title">Entrar</h1>

    <form method="post" action="#" class="registration-form">

      <div class="input-group" data-aos="fade-up" data-aos-delay="200">
        <label for="email">E-MAIL</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
      </div>


      <div class="input-group" data-aos="fade-up" data-aos-delay="400">
        <label for="senha">SENHA</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
      </div>

      <button type="submit" class="btn-submit" onclick="window.location.href='Index.html'" data-aos="fade-up" data-aos-delay="500">Logar</button>
    </form>
  </div>

  <!-- FOOTER COM ÍCONES -->
  <footer>
    <div class="footer-inner">
      <div>
        <img src="Imagens/2.png" alt="Logo NutriCampo">
      </div>
      <div>
        <p class="footer-slogan">Tecnologia e sustentabilidade para a máxima produtividade no campo.</p>
        <div style="margin-top:16px; text-align:center;">
          <p style="font-size:15px; margin-bottom:8px;" class="links">
            <a href="https://api.whatsapp.com/" target="_blank" rel="noopener noreferrer"><i
                class="fa-brands fa-whatsapp me-2" style="color:#25d366;"></i>WhatsApp</a>
          </p>
          <p style="font-size:15px; margin-bottom:8px;" class="links">
            <a href="https://www.instagram.com/guilhermenves_/" target="_blank" rel="noopener noreferrer"><i
                class="fa-brands fa-instagram me-2" style="color:#e1306c;"></i>Instagram</a>
          </p>
          <p style="font-size:15px;" class="links">
            <a href="https://www.facebook.com/plantmaax" target="_blank" rel="noopener noreferrer"><i
                class="fa-brands fa-facebook me-2" style="color:#1877f2;"></i>Facebook</a>
          </p>
        </div>
      </div>
      <div class="footer-map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d519.3178698360501!2d-49.63234126396017!3d-22.898767540390182!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-BR!2sbr!4v1779123045498!5m2!1spt-BR!2sbr"
          width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 NutriCampo — Todos os direitos reservados
    </div>
  </footer>

  <!-- SCRIPT DE INICIALIZAÇÃO DO AOS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      once: true,
      duration: 800
    });
  </script>
</body>

</html>
